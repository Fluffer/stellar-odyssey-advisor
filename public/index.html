<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Stellar Odyssey Advisor</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>Stellar Odyssey Advisor</h1>
  <div class="sub">Gear, catalyst and merge analysis &mdash; read-only</div>

  <div class="sticky-header">
    <div class="toolbar">
      <button id="refresh" onclick="refresh()">Analyze now</button>
      <label style="color:var(--dim);font-size:12px">
        <input type="checkbox" id="auto" onchange="toggleAuto(this.checked)"> auto every 60s
      </label>
      <span id="status"></span>
    </div>

    <div class="cards" id="summary"></div>
    <div class="maintabs">
      <button data-tab="gear" class="ghost" onclick="setTab('gear')">Gear</button>
      <button data-tab="battle" class="ghost" onclick="setTab('battle')">Stats</button>
      <button data-tab="installs" class="ghost" onclick="setTab('installs')">Installs</button>
      <button data-tab="merges" class="ghost" onclick="setTab('merges')">Merges</button>
      <button data-tab="units" class="ghost" onclick="setTab('units')">Droids &amp; Clones</button>
      <button data-tab="tech" class="ghost" onclick="setTab('tech')">Technology</button>
      <button data-tab="pets" class="ghost" onclick="setTab('pets')">Pets</button>
      <button data-tab="inventory" class="ghost" onclick="setTab('inventory')">Inventory</button>
      <button data-tab="materials" class="ghost" onclick="setTab('materials')">Materials</button>
      <button data-tab="lab" class="ghost" onclick="setTab('lab')">Lab</button>
      <button data-tab="history" class="ghost" onclick="setTab('history')">History</button>
    </div>
  </div>

  <div id="content"><div class="empty-note">Click "Analyze now" (game must be running).</div></div>

  <div class="legend">
    <span style="--c:var(--rarity-normal)">normal</span>
    <span style="--c:var(--rarity-uncommon)">uncommon</span>
    <span style="--c:var(--rarity-rare)">rare</span>
    <span style="--c:var(--rarity-unique)">unique</span>
    <span style="--c:var(--rarity-epic)">epic</span>
    <span style="--c:var(--rarity-legendary)">legendary</span>
    <span style="--c:#666">(halved) = 2nd same stat in one group, counts 50%</span>
  </div>
  <div class="sub" style="margin-top:6px">keys 1-9, 0 switch tabs &middot; r = analyze</div>

<script src="/pet-math.js"></script>
<script src="/lab-math.js"></script>
<script src="/app.js"></script>
</body>
</html>
