  <path fill="#EBAC4C" d="M24.8 37.2h10.4v8H24.8z"/>
  <path fill="#C8893C" d="M30 37.2h5.2v8H30z"/>
  <path fill="#F7DFA6" d="M25.9 38.3h2v5.8h-2z"/>
  <path fill="#494A4E" d="M24 36.4h12v1.4H24zM24 44.8h12v1.4H24z"/>
  <!-- thruster glow -->
  <path fill="#3DBDF7" d="M26.2 48.2h7.6l-2.1 3.4h-3.4z"/>
  <path fill="#F0EFEF" opacity=".7" d="M28.2 48.2h3.6l-1 2h-1.6z"/>
</symbol>
</svg>
