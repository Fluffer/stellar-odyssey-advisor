  <path fill="#2E72D4" d="M21.4 36.6a2.6 2.6 0 0 1 2.6-2.6h12a2.6 2.6 0 0 1 2.6 2.6v9a2.6 2.6 0 0 1-2.6 2.6H24a2.6 2.6 0 0 1-2.6-2.6z"/>
