  <path fill="#494A4E" d="M13.1 42.2h4.9v2.6h-4.9zM12.5 45h2.2v3.4h-2.2zM16.4 45h2.2v3.4h-2.2z"/>
  <path fill="#767576" d="M39.4 34.4h4.2a2 2 0 0 1 2 2v6.2h-3.4v-4.8h-2.8z"/>
  <path fill="#494A4E" d="M42 42.2h4.9v2.6H42zM41.4 45h2.2v3.4h-2.2zM45.3 45h2.2v3.4h-2.2z"/>
